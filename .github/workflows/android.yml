name: Android E2E

on:
  push:
  pull_request:

jobs:
  android-e2e:
    name: Android E2E (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_DEVICE_NAME: emulator-5554
      ANDROID_PLATFORM_VERSION: '14'
      APPIUM_PORT: '4723'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # postinstall (scripts/sync-appium-manifest.mjs) registers the
      # pnpm-installed UiAutomator2 driver in the project-local APPIUM_HOME,
      # so the WDIO Appium service can start the server with the driver.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No APK is committed to the repo; fetch the exact build the suite was
      # developed against (2.3.0, same as the local test device).
      - name: Download Swag Labs APK
        run: |
          curl -fSL --retry 3 --retry-all-errors --retry-delay 5 -o /tmp/swaglabs.apk https://github.com/saucelabs/sample-app-mobile/releases/download/2.3.0/Android.SauceLabs.Mobile.Sample.app.2.3.0.apk
          echo "ANDROID_APP_PATH=/tmp/swaglabs.apk" >> "$GITHUB_ENV"

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # ubuntu runners expose /dev/kvm but not to the runner user; without
      # this the action auto-appends `-accel off` and the emulator crawls
      # (adbd goes offline, sessions stall). Action-documented prerequisite.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The runner reports boot before Android's activity/package services
      # (which Appium drives via `settings`/`dumpsys`) are usable, so gate
      # the suite on real readiness instead of boot_completed alone.
      - name: Run Android E2E (full suite)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          # NOTE: this action splits `script` into single lines and runs each
          # via `sh -c`, so no multiline loops/ifs allowed here — the retry
          # loop below is intentionally one line.
          script: |
            adb wait-for-device
            for i in $(seq 1 60); do BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r'); READY=$(adb shell "service check activity 2>/dev/null; service check package 2>/dev/null" | grep -c "found"); if [ "$BOOT" = "1" ] && [ "$READY" -ge 2 ]; then break; fi; sleep 5; done
            adb shell input keyevent 82 || true
            sleep 30
            pnpm test:all

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/
          retention-days: 14
